<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Would you like to go on a 4th?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Work+Sans:ital,wght@0,400;0,500;0,600;1,300&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#D8D6FE;--card:#F4F3FF;--ink:#0A0072;--pink:#FF6EC7;--tile:#FFFEFB;--warn-bg:#FF8A5B;--warn-card:#FDB8B8;--err:#C40000;
--serif:"Playfair Display",Georgia,serif;--sans:"Work Sans",system-ui,sans-serif;--shadow:0 4px 5px rgba(20,0,80,.35)}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{transition:background .3s}body.bad{background:var(--warn-bg)}
main{max-width:393px;margin:0 auto;min-height:100vh;padding:67px 48px 40px;display:flex;flex-direction:column;align-items:center}
main.mid{justify-content:flex-start;padding-top:158px;padding-inline:26px}
section[hidden]{display:none}
section{width:100%;display:flex;flex-direction:column;align-items:center}
.card{background:var(--card);border-radius:19px;width:100%;text-align:center;padding:24px 20px}
.card.big{min-height:313px;box-shadow:var(--shadow)}
.card.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center}
.card.ctr .icon{margin-top:24px}
.mid .card{min-height:222px;display:flex;flex-direction:column;justify-content:center;box-shadow:var(--shadow)}
h1,h2{font-family:var(--serif);font-weight:800;margin:0;line-height:1.2}
h1{font-size:26px}h2{font-size:20px}
.icon{font-size:88px;line-height:1;margin-top:38px}
.btn{font:600 18px var(--sans);color:var(--ink);background:#fff;border:0;border-radius:10px;box-shadow:var(--shadow);cursor:pointer;padding:16px 24px;transition:transform .12s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(20,0,80,.35)}
.btn:focus-visible,.tile:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-top:26px}
.tile{background:var(--tile);border:0;border-radius:10px;box-shadow:0 3px 5px rgba(20,0,80,.3);height:124px;font:700 19px/1.15 var(--sans);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile span{font-size:40px;line-height:1}
.days{display:flex;flex-direction:column;gap:30px;margin-top:64px;width:180px}
.days .btn{font-size:17px;padding:20px 0;text-transform:uppercase}
.times{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 10px;margin-top:8px;max-width:250px}
.times .btn{font:400 16px var(--sans);letter-spacing:.06em;border-radius:2px;padding:14px 0;width:72px;color:#222}
.lbl{align-self:flex-start;margin:64px 0 10px 23px;font:500 12px var(--sans);letter-spacing:.2em;text-transform:uppercase}
.q{font:600 22px/1.3 "Playfair Display",Georgia,serif;font-weight:700}
.yn{display:flex;align-items:center;justify-content:space-around;width:100%;margin-top:34px}
.yes{width:110px;height:63px;font:700 20px Arial,sans-serif}
.slot{width:110px;height:63px}
.no.small{width:40px;height:30px;padding:0;font:700 12px Arial,sans-serif;border-radius:9px}
.no.moving{transition:left .5s ease,top .5s ease,width .5s ease,height .5s ease,font-size .5s ease,border-radius .5s ease}
.photo{border-radius:20px;display:block;margin:18px auto 0;max-width:100%}
.msg{margin:0;font-size:19px;font-weight:500;line-height:1.35}
.ps{font:italic 300 13px/1.35 var(--sans);text-align:center;margin:44px 0 22px;max-width:310px}
.pink{background:var(--pink);width:100%;color:var(--ink)}
.rose{color:var(--pink)}
.bad .card{background:var(--warn-card)}
.err{position:relative;background:var(--warn-card);color:var(--err);border-radius:8px;padding:20px 38px;margin-top:64px;font-size:16px}
.err b{position:absolute;left:-26px;top:-22px;font-size:44px;filter:hue-rotate(0deg)}
.go{display:flex;align-items:center;gap:20px}
.go i{width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;font-style:normal;display:grid;place-items:center;font-size:15px}
.back{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));font-size:15px;padding:11px 20px;z-index:5}
.back[hidden]{display:none}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;left:50%;bottom:0;width:9px;height:16px;opacity:0}
@media (prefers-reduced-motion:reduce){.no.moving{transition:none}.confetti{display:none}.btn{transition:none}}
</style></head><body>

<button class="btn go" style="margin-top:124px;padding:18px 28px" data-go="act"><span>I’m excited!</span><i aria-hidden="true"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M5 12h14M13 6l6 6-6 6"/></svg></i></button>`,confetti:1},
act:{html:`<div class="card big ctr"><h1>What are we doing?</h1><div class="icon" aria-hidden="true">🧩</div></div>
<div class="grid">${[['🛁','Sauna'],['🍿','Movie'],['🎲','Game Night'],['🍷','Dinner<br>/ Drink']].map(([e,l])=>`<button class="tile" data-go="day" data-set="act:${l.replace('<br>','')}"><span>${e}</span>${l}</button>`).join('')}</div>`},
day:{html:`<div class="card big ctr"><h1>When are you free?</h1><div class="icon" aria-hidden="true">📅</div></div>
<div class="days">${[['Friday','#FFD6E8'],['Saturday','#99F2DD'],['Sunday','#FFEBB7']].map(([d,c])=>`<button class="btn" style="background:${c}" data-go="time" data-set="day:${d}">${d}</button>`).join('')}</div>`},
time:{html:`<div class="card big ctr"><h1>What time?</h1><div class="icon" aria-hidden="true">🌅</div></div>
<div class="lbl">Pick a start time</div>
<div class="times">${['4:00','4:30','5:00','5:30','6:00','6:30','7:00','7:30'].map(t=>`<button class="btn" data-go="fin" data-set="time:${t}">${t}</button>`).join('')}</div>`},
confirm:{mid:1,html:`<div class="card"><h1 style="font-size:24px;margin-bottom:38px">Confirmation</h1><p class="msg">Please send a message<br>to confirm your<br>appointment</p><p id="sum" style="margin:18px 0 0;font-size:14px;opacity:.75"></p></div>
<a id="sms" class="btn rose" style="margin-top:98px;width:100%;text-align:center;text-decoration:none;font-size:18px" data-go="ask">Message Emma</a>`},
fin:{mid:1,html:`<div class="card" style="box-shadow:var(--shadow)"><div style="font-size:26px" aria-hidden="true">🎉</div><h1 style="font-size:27px;margin-top:22px">I’m glad you picked Yes,<br>I’ll see you then!</h1></div>
<p class="ps">P.S. Any other average girl wouldn’t make a website for you, just saying…</p>
<button class="btn pink" data-go="confirm">It’s a date 💞</button>`},
no:{bad:1,html:`<div class="card big" style="min-height:313px;padding-top:20px"><h1 style="font-size:24px">Oops!</h1><h2 style="margin-top:2px;font-size:19px">Wrong Answer</h2><div class="icon" style="margin-top:34px" aria-hidden="true">😠</div></div>
<div class="err" role="alert"><b aria-hidden="true">⚠️</b>Error: Incorrect</div>
<button class="btn" style="margin-top:85px" data-go="ask">TRY AGAIN</button>`}
};
function show(k){
  const t=T[k],m=$('app');cur=k;if(k==='ask')noClicks=0;$('back').hidden=!H.length;
  document.body.classList.toggle('bad',!!t.bad);
  m.className=t.mid?'mid':'';
  m.innerHTML=`<section>${t.html}</section>`;
  if(t.confetti){const c=document.createElement('div');c.className='confetti';c.setAttribute('aria-hidden','true');
    m.appendChild(c);
    if(!matchMedia('(prefers-reduced-motion:reduce)').matches){
      const cols=['#E6C94B','#FF5C7A','#9B6FD0','#FFB86B','#4FD1C5','#FF6EC7'],H=innerHeight;
      for(let n=0;n<90;n++){
        const e=document.createElement('i'),a=(-90+(Math.random()-.5)*110)*Math.PI/180,v=(.45+Math.random()*.55)*H*.85,
          dx=Math.cos(a)*v,dy=Math.sin(a)*v,r=(Math.random()-.5)*1080;
        e.style.background=cols[n%cols.length];if(n%3==0){e.style.width=e.style.height='9px';e.style.borderRadius='50%'}
        c.appendChild(e);
        e.animate([{transform:'translate(-50%,0) rotate(0)',opacity:1,offset:0},
          {transform:`translate(calc(-50% + ${dx}px),${dy}px) rotate(${r*.6}deg)`,opacity:1,offset:.45},
          {transform:`translate(calc(-50% + ${dx*1.25}px),${dy+H*.35}px) rotate(${r}deg)`,opacity:0,offset:1}],
          {duration:5000,easing:'cubic-bezier(.2,.7,.4,1)',fill:'forwards'});
      }
      setTimeout(()=>c.remove(),5100);
    }}
  if(k==='confirm'){$('sum').textContent=[S.act,S.day,S.time&&S.time+' pm'].filter(Boolean).join(' · ');
    $('sms').href='https://ig.me/m/emma_muliastra'}
  const f=m.querySelector('button,a');if(f)f.focus({preventScroll:true});
  scrollTo(0,0);
}
$('app').addEventListener('click',e=>{
  const b=e.target.closest('[data-go]');if(!b)return;
  if(b.id==='sms'){e.preventDefault();window.open(b.href,'_blank','noopener')}
  if(b.classList.contains('no')&&noClicks<2){
    if(noClicks++===0){const r=b.getBoundingClientRect();
      b.style.cssText=`position:fixed;left:${r.left}px;top:${r.top}px;margin:0;z-index:5`;
      void b.offsetWidth;b.classList.add('moving','small')}
    const w=40,ht=30,m=12;
    b.style.left=m+Math.random()*(innerWidth-w-2*m)+'px';
    b.style.top=m+Math.random()*(innerHeight-ht-2*m)+'px';return}
  if(b.dataset.set){const[k,v]=b.dataset.set.split(':');S[k]=v}
  const go=b.dataset.go;
  if(go==='ask'){S.act=S.day=S.time='';H.length=0}else H.push(cur);
  show(go);
});
$('back').addEventListener('click',()=>{if(H.length)show(H.pop())});
show('ask');
</script></body></html>
